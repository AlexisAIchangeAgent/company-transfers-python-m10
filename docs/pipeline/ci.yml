# Training material. Semi-automated pipeline: build and unit tests run on every push and
# pull request; the deploy job runs only when started by hand. No real secret, no real deploy.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Fake deploy
        run: echo "Fake deploy of company-transfers to the training environment. Nothing is deployed."
