<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title id="t">Architecture of the transfer-fee service</title>
  <desc id="d">Modules of src/company_transfers and the calls between them, as read in the code. main.py wires api, domain and clients. Only HttpExchangeRateClient calls the external exchange-rate provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- outside the repository -->
  <rect x="330" y="15" width="260" height="44" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="460" y="35" text-anchor="middle">HTTP caller (outside this repository)</text>
  <text x="460" y="51" text-anchor="middle" font-size="11">your service</text>
  <line x1="460" y1="59" x2="460" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="470" y="84" font-size="12">POST /fees, GET /health</text>

  <!-- app column -->
  <text x="20" y="90" font-weight="bold">app (wiring)</text>
  <rect x="20" y="100" width="240" height="120" fill="#f4f4f4" stroke="#333"/>
  <text x="30" y="120" font-weight="bold">main.py</text>
  <text x="30" y="140" font-size="12">create_app(), app</text>
  <text x="30" y="157" font-size="12">build_rate_client()</text>
  <text x="30" y="174" font-size="12">error handlers: 422, 502</text>
  <text x="30" y="191" font-size="12">include_router, FeeCalculator</text>
  <text x="30" y="208" font-size="12">(wiring: dashed arrows)</text>

  <rect x="20" y="260" width="240" height="60" fill="#f4f4f4" stroke="#333"/>
  <text x="30" y="280" font-weight="bold">config.py</text>
  <text x="30" y="298" font-size="12">Settings.from_env()</text>
  <text x="30" y="313" font-size="12">RATES_* environment variables</text>
  <line x1="140" y1="220" x2="140" y2="260" stroke="#333" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- api layer -->
  <rect x="300" y="95" width="680" height="100" fill="none" stroke="#888"/>
  <text x="970" y="111" text-anchor="end" font-size="12" fill="#555">api/</text>
  <rect x="320" y="120" width="300" height="60" fill="#fff" stroke="#333"/>
  <text x="330" y="140" font-weight="bold">routes.py</text>
  <text x="330" y="158" font-size="12">GET /health</text>
  <text x="330" y="173" font-size="12">POST /fees</text>
  <rect x="670" y="120" width="290" height="60" fill="#fff" stroke="#333"/>
  <text x="680" y="140" font-weight="bold">schemas.py</text>
  <text x="680" y="158" font-size="12">FeeRequestBody, FeeResponseBody,</text>
  <text x="680" y="173" font-size="12">ErrorBody, DecimalJSONResponse</text>
  <line x1="620" y1="150" x2="670" y2="150" stroke="#333" marker-end="url(#arrow)"/>

  <!-- domain layer -->
  <rect x="300" y="235" width="680" height="100" fill="none" stroke="#888"/>
  <text x="970" y="251" text-anchor="end" font-size="12" fill="#555">domain/</text>
  <rect x="320" y="260" width="210" height="60" fill="#fff" stroke="#333"/>
  <text x="330" y="280" font-weight="bold">fees.py</text>
  <text x="330" y="298" font-size="12">FeeCalculator.calculate()</text>
  <text x="330" y="313" font-size="12">standard and instant rules</text>
  <rect x="560" y="260" width="190" height="60" fill="#fff" stroke="#333"/>
  <text x="570" y="280" font-weight="bold">models.py</text>
  <text x="570" y="298" font-size="12">enums, FeeRequest, Fee,</text>
  <text x="570" y="313" font-size="12">UnsupportedTransferError</text>
  <rect x="780" y="260" width="180" height="60" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="790" y="280" font-weight="bold">iban.py</text>
  <text x="790" y="298" font-size="12">mask_iban()</text>
  <text x="790" y="313" font-size="12">no caller in src/</text>
  <line x1="530" y1="290" x2="560" y2="290" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="420" y1="180" x2="420" y2="260" stroke="#333" marker-end="url(#arrow)"/>
  <text x="430" y="224" font-size="12">calculate()</text>

  <!-- clients layer -->
  <rect x="300" y="375" width="680" height="130" fill="none" stroke="#888"/>
  <text x="970" y="391" text-anchor="end" font-size="12" fill="#555">clients/exchange_rate.py</text>
  <rect x="320" y="400" width="200" height="90" fill="#fff" stroke="#333"/>
  <text x="330" y="420" font-weight="bold">ExchangeRateClient</text>
  <text x="330" y="438" font-size="12">Protocol: get_rate()</text>
  <text x="330" y="453" font-size="12">the only name domain/</text>
  <text x="330" y="468" font-size="12">imports from clients/</text>
  <rect x="550" y="400" width="200" height="90" fill="#fff" stroke="#333"/>
  <text x="560" y="420" font-weight="bold">HttpExchangeRateClient</text>
  <text x="560" y="438" font-size="12">urllib call, timeout,</text>
  <text x="560" y="453" font-size="12">X-Api-Key if set</text>
  <text x="560" y="468" font-size="12">used if RATES_BASE_URL set</text>
  <rect x="780" y="400" width="180" height="90" fill="#fff" stroke="#333"/>
  <text x="790" y="420" font-weight="bold">FixedRateClient</text>
  <text x="790" y="438" font-size="12">rate 19.8765, no network</text>
  <text x="790" y="453" font-size="12">used if RATES_BASE_URL</text>
  <text x="790" y="468" font-size="12">is not set</text>
  <line x1="420" y1="320" x2="420" y2="400" stroke="#333" marker-end="url(#arrow)"/>
  <text x="430" y="364" font-size="12">get_rate() (EUR amounts only)</text>

  <!-- external -->
  <rect x="520" y="560" width="260" height="50" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="650" y="581" text-anchor="middle">Exchange-rate provider (third party)</text>
  <text x="650" y="597" text-anchor="middle" font-size="11">outside this repository</text>
  <line x1="650" y1="490" x2="650" y2="560" stroke="#333" marker-end="url(#arrow)"/>
  <text x="660" y="530" font-size="12">GET /rates?from=EUR&amp;to=MDL</text>

  <!-- wiring arrows from main.py -->
  <line x1="260" y1="130" x2="320" y2="145" stroke="#333" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="260" y1="190" x2="320" y2="280" stroke="#333" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="260" y1="215" x2="300" y2="440" stroke="#333" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="20" y="530" font-weight="bold" font-size="12">Legend</text>
  <line x1="20" y1="545" x2="70" y2="545" stroke="#333" marker-end="url(#arrow)"/>
  <text x="80" y="549" font-size="12">call or import</text>
  <line x1="20" y1="565" x2="70" y2="565" stroke="#333" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="80" y="569" font-size="12">built or wired in main.py</text>
  <rect x="20" y="578" width="50" height="14" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="80" y="590" font-size="12">outside the service, or not called</text>
  <text x="20" y="620" font-size="11" fill="#555">Source: src/company_transfers/ (main.py, config.py, api/, domain/, clients/).</text>
</svg>
